AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'LLM personal assitant to manage projects'

# ─────────────────────────────────────────────
# Globals shared across all Lambda functions
# ─────────────────────────────────────────────
Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - arm64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

# ─────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key used by skill Lambdas

# ─────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────
Resources:

  # ── POC: decompose_task skill ──────────────
  # Per architecture.md POC scope: one Lambda, a Function URL, no API
  # Gateway, no datastore. Exists to validate the Task struct's fields.
  DecomposeTaskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: bootstrap
      FunctionName: !Sub ${Environment}-nudge-decompose-task
      Description: "POC: decompose a task into subtasks via OpenAI"
      MemorySize: 1024
      Timeout: 60
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey

Outputs:
  DecomposeTaskFunctionUrl:
    Description: Function URL for the decompose_task POC
    Value: !GetAtt DecomposeTaskFunctionUrl.FunctionUrl
