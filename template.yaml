AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'LLM personal assitant to manage projects'

# ─────────────────────────────────────────────
# Globals shared across all Lambda functions
# ─────────────────────────────────────────────
Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: provided.al2
    Architectures:
      - arm64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

# ─────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

# ─────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────
Resources:

  # ── HTTP API (v2) ──────────────────────────
  NudgeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: Nudge HTTP API
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-User-Id
        MaxAge: 86400

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./api/functions/project/create
      Handler: bootstrap
      FunctionName: !Sub ${Environment}-nudge-create-project
      Description: "Create a new project"
      Events:
        CreateProjectEvent:
          Type: HttpApi
          Properties:
            Path: /projects
            Method: POST
            ApiId: !Ref NudgeApi
            
            