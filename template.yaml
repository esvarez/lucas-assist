AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'LLM personal assitant to manage projects'

# ─────────────────────────────────────────────
# Globals shared across all Lambda functions
# ─────────────────────────────────────────────
Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - arm64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

# ─────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  # Both empty by default so a first deploy works against CloudFront's
  # default *.cloudfront.net domain with no prerequisites (architecture.md
  # §13: "A CloudFront default domain is enough for the first deploy if a
  # cert is not ready"). Supplying DomainName without AcmCertificateArn (or
  # vice versa) is a deploy-time error the stack surfaces on its own — no
  # extra validation added here.
  #
  # CloudFront only accepts ACM certificates from us-east-1, regardless of
  # which region this stack deploys to — request the certificate there
  # out of band (same out-of-band posture as the OpenAI SSM parameter
  # below) and pass its ARN in here.
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain for the CloudFront distribution (e.g. app.example.com). Leave empty to use the CloudFront default domain.

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for DomainName, in us-east-1 (CloudFront requirement regardless of this stack's own region). Required only if DomainName is set.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

# ─────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────
Resources:

  # ── DynamoDB table ──────────────────────────
  # Single table (architecture.md §7), keyed identically to
  # internal/store/table.go's EnsureTable (used for local dev / DynamoDB
  # Local), so the same code path works against both. No GSIs yet — added
  # additively against a live table later (architecture.md §7; AGENTS.MD:
  # stop and ask before adding a GSI).
  #
  # TableName is environment-scoped (matches FunctionName below) so dev/
  # staging/prod deploys in the same account never collide on one table.
  NudgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-nudge
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ── HTTP API (v2) ──────────────────────────
  # API Gateway HTTP API, not REST API (architecture.md §13).
  NudgeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment

  # ── API Lambda ──────────────────────────────
  # All CRUD and changeset commits behind one proxy route (architecture.md
  # §11): a single net/http.ServeMux does the actual routing, so this stays
  # one Lambda/one warm pool no matter how many routes get added.
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: bootstrap
      FunctionName: !Sub ${Environment}-nudge-api
      Description: "API Lambda: CRUD and changeset commits"
      MemorySize: 512
      Timeout: 5
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref NudgeTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeTable
      Events:
        ProxyEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref NudgeApi

  # ── Agent job queue ──────────────────────────
  # SQS as the only async work transport (architecture.md §10/§11/§18,
  # ADR 006) for AgentRun jobs — SkillsFunction sends to this (#99);
  # WorkerFunction consumes it (#101).
  #
  # VisibilityTimeout is 360s: AWS's own guidance for Lambda-consumed
  # queues is at least 6x the consumer function's timeout, so a message
  # being processed isn't redelivered to a second worker before the first
  # one finishes. WorkerFunction's Timeout is 60s, so this sits exactly at
  # that 6x minimum.
  AgentJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-nudge-agent-jobs
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AgentJobsDLQ.Arn
        # 3 total attempts: architecture.md §15 wants transient-failure
        # tolerance, but a model call has a real per-attempt cost, so a
        # systematically failing job (bad input, a skill bug) shouldn't
        # retry indefinitely before landing in the DLQ.
        maxReceiveCount: 3

  # Dead-letter queue for AgentJobsQueue (architecture.md §15: "Move
  # exhausted jobs to a dead letter queue and raise an alarm" — the alarm
  # is separate follow-up work, not this issue).
  AgentJobsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Environment}-nudge-agent-jobs-dlq

  # ── Skill Lambda ─────────────────────────────
  # Consolidated entrypoint (architecture.md §4/§11): one Lambda dispatches
  # by skill name from the request body to a registered agent.Skill, so
  # adding a skill is one new file, not a new Lambda.
  #
  # Routed onto NudgeApi (POST /skills, issue #60) so propose (this) and
  # accept (POST /projects on ApiFunction) share one origin — a browser
  # would otherwise need to SigV4 a Function URL directly, or the two
  # origins would push toward CORS, which architecture.md §13 and
  # AGENTS.md forbid.
  #
  # Skill dispatch is asynchronous (architecture.md §1/§10, issue #99): this
  # function validates the request, creates a queued AgentRun, and sends
  # its run ID to AgentJobsQueue — it returns 202 before any model call
  # happens. It no longer calls OpenAI itself (that moves to the Agent
  # Worker, #101, once it exists), so it holds no OpenAI credential and
  # needs no SSM/KMS permissions — only DynamoDB write (to create the run)
  # and SQS send (to enqueue it). This also resolves the old timeout
  # mismatch between this function's 60s Timeout and API Gateway's
  # non-configurable 30s AWS_PROXY integration timeout: nothing this
  # function does runs anywhere near 30s anymore.
  #
  # Function URL stays alongside the new route rather than being removed.
  # NudgeApi has no authorizer yet, so POST /skills is now exactly as
  # public as POST /projects — same posture as the rest of the unauthed
  # CRUD API, not a regression. The IAM-signed Function URL is kept as a
  # narrower, SigV4-only calling path until GitHub OAuth lands; drop it
  # then if nothing still uses it.
  SkillsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: bootstrap
      FunctionName: !Sub ${Environment}-nudge-skills
      Description: "Skill Lambda: decompose_task and future skills"
      MemorySize: 1024
      Timeout: 60
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref NudgeTable
          AGENT_JOBS_QUEUE_URL: !Ref AgentJobsQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AgentJobsQueue.QueueName
      Events:
        SkillsApiEvent:
          Type: HttpApi
          Properties:
            Path: /skills
            Method: POST
            ApiId: !Ref NudgeApi

  # ── Agent Worker Lambda ──────────────────────
  # Consumes AgentJobsQueue (architecture.md §1/§10/§11, issue #101): leases
  # the referenced AgentRun, calls the model via agent.Run, and saves the
  # result as a Changeset. This is the only function that holds the OpenAI
  # credential (architecture.md §14) — SkillsFunction stopped needing it
  # once dispatch became asynchronous (#99).
  #
  # BatchSize: 1 keeps this simple: one invocation processes exactly one
  # run, so a slow or failing model call never blocks or fails a batch of
  # unrelated runs. No FunctionUrlConfig — this Lambda is never invoked
  # over HTTP, only via the SQS event source below.
  #
  # The OpenAI key is resolved at runtime from SSM Parameter Store, not a
  # SAM parameter (architecture.md §18) — it never transits CloudFormation
  # as plaintext. Deploy prerequisite, run once per environment before the
  # first deploy (same parameter SkillsFunction used before #99):
  #   aws ssm put-parameter \
  #     --name /${Environment}/nudge/openai-api-key \
  #     --type SecureString \
  #     --value <key>
  WorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: bootstrap
      FunctionName: !Sub ${Environment}-nudge-worker
      Description: "Agent Worker Lambda: consumes AgentJobsQueue, calls the model, saves the Changeset"
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref NudgeTable
          OPENAI_API_KEY_PARAM: !Sub /${Environment}/nudge/openai-api-key
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NudgeTable
        - Statement:
            - Sid: ReadOpenAIKeyParameter
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/nudge/openai-api-key
            # Resource must be "*" here: an alias ARN (e.g. alias/aws/ssm) in
            # an IAM policy's Resource element does not authorize Decrypt
            # against the underlying key — IAM does not resolve aliases for
            # that purpose, so GetParameter's decrypt would be denied at
            # runtime despite this statement existing. There's also no way
            # to reference the AWS-managed key's real key ARN statically,
            # since its key ID isn't known at template-authoring time. The
            # kms:ViaService condition scopes this to calls KMS receives
            # through SSM, rather than granting decrypt on every key in the
            # account.
            - Sid: DecryptOpenAIKeyParameter
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        AgentJobsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AgentJobsQueue.Arn
            BatchSize: 1

  # ── Web bucket + CloudFront ──────────────────
  # Hosts the built Vite SPA and fronts NudgeApi behind one origin
  # (architecture.md §13, #71) so the browser never needs CORS. Nothing
  # here uploads web/dist's contents — that's a deploy-time `aws s3 sync`
  # step (see Makefile's deploy-web), out of scope for what `sam deploy`
  # itself provisions.
  #
  # Bucket name includes AccountId: S3 bucket names are unique across all
  # of AWS, not just this account, so the ${Environment}-nudge-* pattern
  # every other resource uses isn't safe here on its own.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Environment}-nudge-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Lets only this stack's CloudFront distribution read WebBucket — no
  # bucket website endpoint, no public bucket policy (AGENTS.MD).
  WebBucketOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Environment}-nudge-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  # Rewrites a route like /projects/123 to /index.html at the edge before
  # it ever reaches S3, so the SPA's client-side router sees the real
  # requested URL on a hard refresh instead of CloudFront needing a
  # distribution-wide CustomErrorResponses 403/404->index.html rewrite,
  # which would also swallow real errors from the /api/* behavior below
  # (there's no per-behavior way to scope CustomErrorResponses). Only a
  # request whose last path segment has no "." (i.e. not a hashed asset
  # like /assets/index-abc123.js) is rewritten — real asset 404s pass
  # through untouched.
  SpaFallbackFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${Environment}-nudge-spa-fallback
      FunctionConfig:
        Comment: Rewrite non-asset paths to /index.html for client-side routing
        Runtime: cloudfront-js-2.0
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
          if (lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # Backend routes (internal/api/router.go, internal/skillsapi) are
  # registered without an /api prefix — the same contract the Vite dev
  # proxy already strips locally (web/vite.config.ts). This function keeps
  # that contract identical in production: CloudFront still matches the
  # /api/* cache behavior on the original request path, then this rewrites
  # it before forwarding to NudgeApi, so the app's router never needs to
  # know it's behind a prefix in one environment and not another.
  ApiPathRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${Environment}-nudge-api-path-rewrite
      FunctionConfig:
        Comment: Strip the /api prefix before forwarding to NudgeApi
        Runtime: cloudfront-js-2.0
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/api/, '') || '/';
          return request;
        }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: WebBucketOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebBucketOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: NudgeApiOrigin
            DomainName: !Sub ${NudgeApi}.execute-api.${AWS::Region}.amazonaws.com
            # NudgeApi's stage is Environment-named (StageName: !Ref
            # Environment above); OriginPath re-adds it so a request
            # forwarded here as e.g. /projects lands on /${Environment}/projects,
            # matching how API Gateway actually routes it.
            OriginPath: !Sub /${Environment}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: WebBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized: long TTL, honors each object's own
          # Cache-Control (set at upload time — see Makefile's deploy-web
          # — so hashed assets cache long and index.html doesn't need a
          # separate behavior to stay uncached).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaFallbackFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: NudgeApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            # Managed-CachingDisabled: model-backed and per-user responses
            # must never be cached at the edge.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader: forwards every viewer
            # header (bar Host), cookie, and query string the API might
            # need — including a future Authorization bearer token once
            # #81 lands — without hand-maintaining an allowlist here.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewriteFunction.FunctionARN

Outputs:
  SkillsFunctionUrl:
    Description: Function URL for the Skill Lambda
    Value: !GetAtt SkillsFunctionUrl.FunctionUrl
  ApiUrl:
    Description: Base URL of the Nudge HTTP API (POST /projects, POST /skills)
    Value: !Sub https://${NudgeApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  AgentJobsQueueUrl:
    Description: URL of the agent job queue — #99 sends AgentRun job messages here.
    Value: !Ref AgentJobsQueue
  AgentJobsQueueArn:
    Description: ARN of the agent job queue — WorkerFunction consumes it.
    Value: !GetAtt AgentJobsQueue.Arn
  WebBucketName:
    Description: S3 bucket holding the built SPA — deploy-web syncs web/dist here.
    Value: !Ref WebBucket
  CloudFrontDistributionId:
    Description: Distribution id — deploy-web invalidates /index.html here after each sync.
    Value: !Ref WebDistribution
  CloudFrontDomainName:
    Description: Public URL for the SPA and, via /api/*, NudgeApi. Use DomainName instead once a custom domain is set.
    Value: !Sub https://${WebDistribution.DomainName}
