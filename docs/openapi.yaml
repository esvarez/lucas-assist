openapi: 3.0.3
info:
  title: Nudge API
  description: >
    Project CRUD routes served by the API Lambda (cmd/api) and the local dev
    server (cmd/local). Reflects the current implementation in
    internal/api — user_id is caller-supplied today; deriving it from a
    verified JWT is separate, undecided auth work (see AGENTS.md).
  version: "0.1.0"
servers:
  - url: http://localhost:8080
    description: Local dev server (make local)

paths:
  /projects:
    post:
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid body or failed validation (e.g. missing user_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: A project with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List projects for a user
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: Projects owned by user_id (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          description: user_id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      summary: Get a project by id
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: user_id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update a project
      description: >
        Updates the mutable fields only — goal, deadline, constraints,
        status. Name is immutable via this route.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid body, or failed validation (missing user_id or version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            version doesn't match the project's current version (optimistic
            concurrency, architecture.md §8) — re-fetch and retry, don't
            retry the same request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "204":
          description: Project deleted
        "400":
          description: user_id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}/changesets/{changesetId}/accept:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
      - name: changesetId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Accept a proposed changeset
      description: >
        Atomically commits a changeset's proposed tasks: creates each as a
        Task, increments the project's version, and appends one Event, all
        in a single transaction (architecture.md §1/§9's "Accept changeset
        -> conditional transaction -> applied result"). A changeset over 50
        mutations (ADR 009) is rejected before any write. idempotency_key
        deduplicates retries (architecture.md §15) — replaying the same key
        against the same changeset returns the original result unchanged.
      operationId: acceptChangeset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptChangesetRequest"
      responses:
        "200":
          description: Changeset accepted and applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptChangesetResponse"
        "400":
          description: >
            Invalid body, missing user_id/idempotency_key, or the
            changeset exceeds the 50-mutation cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: No project or changeset with these ids in this user's partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The changeset isn't in "proposed" status (already applied with
            a different idempotency key, rejected, expired, or already
            conflict), the project's version no longer matches the
            changeset's base_version (moved to "conflict" — re-propose,
            don't retry this request), or idempotency_key was already used
            for a different changeset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /agent-runs/{id}:
    get:
      summary: Poll an agent run
      description: >
        architecture.md §10 step 8: the client polls this with bounded
        backoff. project_id is accepted as an optional query parameter
        rather than part of the URL — AgentRun's DynamoDB key embeds the
        project (or a fixed placeholder for a project-less create_project
        run), so a lookup by run id alone isn't possible without a GSI or a
        table Scan. Omit it only for a create_project run; supply it for
        every other skill, since the client already has it from the
        request that created the run. Once the run is completed, the
        response also includes the Changeset it produced.
      operationId: getAgentRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/UserIdQuery"
        - name: project_id
          in: query
          required: false
          description: >
            Omit only for a create_project run (which has no project yet).
          schema:
            type: string
      responses:
        "200":
          description: The run's current status, plus its Changeset once completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResult"
        "400":
          description: user_id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /skills:
    post:
      summary: Dispatch a skill asynchronously
      description: >
        Creates a queued AgentRun for the named skill and enqueues it for
        the Agent Worker (architecture.md §1/§10). Does not call the model
        itself — poll GET /agent-runs/{id} (#100) for the result once one
        exists. Registry lookup and input-shape validation still happen
        synchronously: an unknown skill or malformed input is rejected
        before any AgentRun is created or enqueued.
      operationId: dispatchSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchSkillRequest"
      responses:
        "202":
          description: AgentRun created and enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchSkillResponse"
        "400":
          description: >
            Invalid body, missing user_id, or input that fails the skill's
            own shape validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No skill registered under this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    UserIdQuery:
      name: user_id
      in: query
      required: true
      description: Owner of the project(s). Caller-supplied for now.
      schema:
        type: string
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: No project with this id in this user's partition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Project:
      type: object
      properties:
        user_id:
          type: string
        id:
          type: string
        name:
          type: string
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
        version:
          type: integer
          description: >
            Optimistic-concurrency version (architecture.md §8). Starts at 1
            on create, increments by 1 on every successful update.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - user_id
        - id
        - name
        - goal
        - constraints
        - status
        - version
        - created_at
        - updated_at

    CreateProjectRequest:
      type: object
      properties:
        user_id:
          type: string
          description: Required — the DynamoDB key schema partitions by user.
        name:
          type: string
          description: Required — a Project's defining content (architecture.md §3).
        goal:
          type: string
          description: Required — a Project's defining content (architecture.md §3).
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
      required:
        - user_id
        - name
        - goal

    UpdateProjectRequest:
      type: object
      description: name is intentionally absent — this route never touches it.
      properties:
        user_id:
          type: string
        version:
          type: integer
          description: >
            Required — the project's version as last read (Project.version).
            Rejected with 409 if it no longer matches the stored version
            (architecture.md §8).
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
      required:
        - user_id
        - version

    AgentRunResult:
      type: object
      description: domain.AgentRun's fields, flattened, plus changeset once completed.
      properties:
        id:
          type: string
        user_id:
          type: string
        project_id:
          type: string
          description: Empty for a create_project run.
        skill:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        attempt:
          type: integer
        worker_id:
          type: string
        lease_until:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          description: Set when status is "failed".
        changeset_id:
          type: string
          description: Set once status is "completed".
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        changeset:
          allOf:
            - $ref: "#/components/schemas/Changeset"
          nullable: true
          description: Present only once status is "completed".
      required:
        - id
        - user_id
        - skill
        - status
        - attempt
        - created_at
        - updated_at

    Changeset:
      type: object
      description: domain.Changeset — see internal/domain/changeset.go.
      properties:
        id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
        skill:
          type: string
        base_version:
          type: integer
        status:
          type: string
          enum: [proposed, accepted, applying, applied, rejected, expired, conflict]
        proposed_tasks:
          type: array
          items:
            type: object
            description: domain.ProposedTask — see internal/domain/task.go.
        created_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - user_id
        - skill
        - base_version
        - status
        - created_at

    DispatchSkillRequest:
      type: object
      properties:
        skill:
          type: string
          description: Name of a registered agent.Skill (e.g. decompose_task).
        input:
          type: object
          description: >
            The skill's raw input, validated against that skill's own
            expected shape (see e.g. DecomposeInput, CreateProjectInput) —
            not a shape this spec constrains generically.
        user_id:
          type: string
          description: >
            Required — every AgentRun needs an owner (architecture.md §8).
        project_id:
          type: string
          description: >
            Optional. Empty for create_project, which doesn't have a
            project yet — that's the point of the run.
      required:
        - skill
        - input
        - user_id

    DispatchSkillResponse:
      type: object
      properties:
        run_id:
          type: string
          description: ID of the AgentRun created for this request.
      required:
        - run_id

    AcceptChangesetRequest:
      type: object
      properties:
        user_id:
          type: string
          description: Required — caller-supplied for now, same as every other route.
        idempotency_key:
          type: string
          description: >
            Required. Replaying an accept with the same key against the
            same changeset returns the original result instead of
            re-applying it (architecture.md §15).
      required:
        - user_id
        - idempotency_key

    AcceptChangesetResponse:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        event:
          $ref: "#/components/schemas/Event"
      required:
        - project
        - tasks
        - event

    Task:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        parent_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        order:
          type: integer
        acceptance_criteria:
          type: array
          items:
            type: string
      required:
        - id
        - project_id
        - title
        - status
        - order

    Event:
      type: object
      description: >
        Append-only audit record of an accepted project change
        (architecture.md §9). There's no GET route for these yet.
      properties:
        id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
        type:
          type: string
          description: Only "changeset_accepted" exists today.
        changeset_id:
          type: string
        actor_id:
          type: string
        base_version:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - user_id
        - type
        - changeset_id
        - actor_id
        - base_version
        - created_at

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required:
        - error
        - fields
