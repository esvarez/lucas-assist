openapi: 3.0.3
info:
  title: Nudge API
  description: >
    Project CRUD routes served by the API Lambda (cmd/api) and the local dev
    server (cmd/local). Every route requires a Cognito access token
    (architecture.md §12/§14, #81) — the caller's user ID comes from the
    token's verified `sub` claim, never from a path, query parameter, or
    request body.
  version: "0.2.0"
servers:
  - url: http://localhost:8080
    description: Local dev server (make local)

security:
  - bearerAuth: []

paths:
  /projects:
    post:
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid body or failed validation (e.g. missing name/goal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A project with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List projects owned by the authenticated caller
      operationId: listProjects
      responses:
        "200":
          description: Projects owned by the caller (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      summary: Get a project by id
      operationId: getProject
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update a project
      description: >
        Updates the mutable fields only — goal, deadline, constraints,
        status. Name is immutable via this route.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid body, or failed validation (missing version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            version doesn't match the project's current version (optimistic
            concurrency, architecture.md §8) — re-fetch and retry, don't
            retry the same request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete a project
      operationId: deleteProject
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}/changesets:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      summary: List a project's changesets
      description: >
        Returns every changeset belonging to the project, optionally
        filtered to one status via ?status= (#169, e.g. ?status=proposed).
        Added so a client can rediscover a pending decompose_task
        proposal's id after a page refresh — nothing else exposes a
        changeset's id without already having it from the AgentRun that
        created it.
      operationId: listChangesets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [proposed, accepted, applying, applied, rejected, expired, conflict]
      responses:
        "200":
          description: The project's changesets (possibly empty), filtered if requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  changesets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Changeset"
                required:
                  - changesets
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No project with this id in this user's partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}/changesets/{changesetId}/accept:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
      - name: changesetId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Accept some or all of a proposed changeset's tasks
      description: >
        Atomically commits the selected proposed tasks: creates each as a
        Task, increments the project's version, and appends one Event, all
        in a single transaction (architecture.md §1/§9's "Accept changeset
        -> conditional transaction -> applied result"). The request body's
        optional tasks (#169) selects which proposed tasks to commit now,
        by index, with optional edits — see AcceptChangesetRequest. Any
        proposed task not selected stays "proposed" on the changeset
        (returned in the response's changeset field) for a later accept or
        a PATCH .../tasks removal, instead of every accept call being
        all-at-once terminal. Selecting more than 50 tasks in one call
        (ADR 009) is rejected before any write. idempotency_key
        deduplicates retries (architecture.md §15) — replaying the exact
        same request (same key, same selection) returns the original
        result unchanged; reusing a key with a different selection is
        rejected instead.
      operationId: acceptChangeset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptChangesetRequest"
      responses:
        "200":
          description: The selected tasks were accepted and applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptChangesetResponse"
        "400":
          description: >
            Invalid body, missing idempotency_key, the selection exceeds
            the 50-mutation cap, resolves to nothing when tasks are
            actually available to select, repeats an index, references an
            index out of range, or edits a task to a blank title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No project or changeset with these ids in this user's partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The changeset isn't in "proposed" status (already fully applied
            with a different idempotency key, rejected, expired, or already
            conflict), the project's version no longer matches the
            changeset's base_version (moved to "conflict" — re-propose,
            don't retry this request), or idempotency_key was already used
            for a different selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}/changesets/{changesetId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
      - name: changesetId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Remove one or more proposed tasks without accepting them
      description: >
        Persists removing proposed tasks from a still-"proposed" changeset
        (#169) — no Task rows are created, no project version change. The
        request body is the full list of proposed tasks that should remain
        (the client's current list minus whatever it just removed), the
        same "send the current desired state" shape accept used before
        index selection replaced it there. An empty list rejects the
        changeset — there's nothing "proposed" left to act on. An edit the
        user hasn't accepted yet is never sent here; edits are only
        persisted by accepting that same task (see the accept route).
      operationId: updateChangesetTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tasks:
                  type: array
                  items:
                    type: object
                    description: domain.ProposedTask — see internal/domain/task.go.
              required:
                - tasks
      responses:
        "200":
          description: The changeset's proposed_tasks now reflect the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeset:
                    $ref: "#/components/schemas/Changeset"
                required:
                  - changeset
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No project or changeset with these ids in this user's partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The changeset isn't in "proposed" status (a concurrent accept may have just finished it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /changesets/{changesetId}/accept:
    parameters:
      - name: changesetId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Accept a proposed create_project changeset
      description: >
        Commits a create_project changeset into a brand-new Project
        (architecture.md §1/§9, #152) — the project-less counterpart to
        POST /projects/{id}/changesets/{changesetId}/accept above. There's
        no existing project to address in a URL or version-check against
        (base_version is meaningless for these changesets — see the
        Changeset schema); this writes a new project instead, the same way
        POST /projects does. idempotency_key deduplicates retries
        (architecture.md §15) the same way the other accept route does.
      operationId: acceptCreateProjectChangeset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptChangesetRequest"
      responses:
        "201":
          description: Changeset accepted and the new project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: >
            Invalid body, missing idempotency_key, or the changeset isn't a
            create_project proposal (wrong skill, or no proposed_project)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No changeset with this id in this user's partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The changeset isn't in "proposed" status (already applied with
            a different idempotency key, rejected, expired, or already
            conflict), or idempotency_key was already used for a different
            changeset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      summary: List a project's tasks
      description: >
        Returns the project's tasks flat, linked by parent_id — not nested.
        Building a tree out of the flat list, if a caller wants one, is
        client-side presentation logic (#125).
      operationId: listTasks
      responses:
        "200":
          description: The project's tasks (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}/agent-runs:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      summary: List a project's agent runs
      description: >
        Returns every agent run belonging to the project, optionally
        filtered to one status via ?status= (#169, e.g. ?status=running).
        Added so a client can rediscover a decompose_task run that's still
        queued/running after a page refresh and resume polling it — the
        run's id would otherwise only ever be known from the response to
        the request that created it.
      operationId: listAgentRuns
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, completed, failed, cancelled, needs_input]
      responses:
        "200":
          description: The project's agent runs (possibly empty), filtered if requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentRunResult"
                required:
                  - agent_runs
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No project with this id in this user's partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /agent-runs/{id}:
    get:
      summary: Poll an agent run
      description: >
        architecture.md §10 step 8: the client polls this with bounded
        backoff. project_id is accepted as an optional query parameter
        rather than part of the URL — AgentRun's DynamoDB key embeds the
        project (or a fixed placeholder for a project-less create_project
        run), so a lookup by run id alone isn't possible without a GSI or a
        table Scan. Omit it only for a create_project run; supply it for
        every other skill, since the client already has it from the
        request that created the run. Once the run is completed, the
        response also includes the Changeset it produced.
      operationId: getAgentRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          description: >
            Omit only for a create_project run (which has no project yet).
          schema:
            type: string
      responses:
        "200":
          description: The run's current status, plus its Changeset once completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /skills:
    post:
      summary: Dispatch a skill asynchronously
      description: >
        Creates a queued AgentRun for the named skill and enqueues it for
        the Agent Worker (architecture.md §1/§10). Does not call the model
        itself — poll GET /agent-runs/{id} (#100) for the result once one
        exists. Registry lookup and input-shape validation still happen
        synchronously: an unknown skill or malformed input is rejected
        before any AgentRun is created or enqueued.
      operationId: dispatchSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchSkillRequest"
      responses:
        "202":
          description: AgentRun created and enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchSkillResponse"
        "400":
          description: >
            Invalid body, or input that fails the skill's own shape
            validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No skill registered under this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A Cognito access token. API Gateway's Cognito JWT authorizer
        validates it before the request reaches the API Lambda
        (architecture.md §14) — the user ID is the token's `sub` claim,
        never a path, query, or body value.

  parameters:
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: No project with this id in this user's partition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Project:
      type: object
      properties:
        user_id:
          type: string
        id:
          type: string
        name:
          type: string
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
        domain:
          type: string
          enum: [software, general]
          description: >
            Whether this is a Software or General project (issue #150).
            Defaults to general — both for a create request that omits it,
            and for a project persisted before this field existed.
        version:
          type: integer
          description: >
            Optimistic-concurrency version (architecture.md §8). Starts at 1
            on create, increments by 1 on every successful update.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - user_id
        - id
        - name
        - goal
        - constraints
        - status
        - domain
        - version
        - created_at
        - updated_at

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: Required — a Project's defining content (architecture.md §3).
        goal:
          type: string
          description: Required — a Project's defining content (architecture.md §3).
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
        domain:
          type: string
          enum: [software, general]
          description: Defaults to general when omitted.
      required:
        - name
        - goal

    UpdateProjectRequest:
      type: object
      description: name is intentionally absent — this route never touches it.
      properties:
        version:
          type: integer
          description: >
            Required — the project's version as last read (Project.version).
            Rejected with 409 if it no longer matches the stored version
            (architecture.md §8).
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
      required:
        - version

    AgentRunResult:
      type: object
      description: domain.AgentRun's fields, flattened, plus changeset once completed.
      properties:
        id:
          type: string
        user_id:
          type: string
        project_id:
          type: string
          description: Empty for a create_project run.
        skill:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, needs_input]
        attempt:
          type: integer
        worker_id:
          type: string
        lease_until:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          description: Set when status is "failed".
        questions:
          type: array
          items:
            type: string
          description: >
            Clarifying questions, set when status is "needs_input" (round 0
            only — see internal/agent/skills/decompose_task.go and
            create_project.go, the two skills that support this). Answering
            is a fresh POST /skills dispatch carrying clarification_round
            and clarifications, not a resume of this run.
        changeset_id:
          type: string
          description: Set once status is "completed".
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        changeset:
          allOf:
            - $ref: "#/components/schemas/Changeset"
          nullable: true
          description: Present only once status is "completed".
      required:
        - id
        - user_id
        - skill
        - status
        - attempt
        - created_at
        - updated_at

    Changeset:
      type: object
      description: domain.Changeset — see internal/domain/changeset.go.
      properties:
        id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
        skill:
          type: string
        base_version:
          type: integer
        status:
          type: string
          enum: [proposed, accepted, applying, applied, rejected, expired, conflict]
        proposed_tasks:
          type: array
          items:
            type: object
            description: domain.ProposedTask — see internal/domain/task.go.
        assumptions:
          type: array
          items:
            type: string
          description: decompose_task's disclosed unspecified-choice decisions. Absent for create_project changesets.
        proposed_project:
          $ref: "#/components/schemas/ProposedProject"
          description: >
            create_project's mutation payload. Present only for
            create_project changesets, which carry this instead of
            proposed_tasks — see POST /changesets/{changesetId}/accept.
        created_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - user_id
        - skill
        - base_version
        - status
        - created_at

    ProposedProject:
      type: object
      description: domain.ProposedProject — see internal/domain/project.go.
      properties:
        name:
          type: string
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
      required:
        - name
        - goal

    DispatchSkillRequest:
      type: object
      properties:
        skill:
          type: string
          description: Name of a registered agent.Skill (e.g. decompose_task).
        input:
          type: object
          description: >
            The skill's raw input, validated against that skill's own
            expected shape (see e.g. DecomposeInput, CreateProjectInput) —
            not a shape this spec constrains generically.
        project_id:
          type: string
          description: >
            Optional. Empty for create_project, which doesn't have a
            project yet — that's the point of the run.
      required:
        - skill
        - input

    DispatchSkillResponse:
      type: object
      properties:
        run_id:
          type: string
          description: ID of the AgentRun created for this request.
      required:
        - run_id

    AcceptChangesetRequest:
      type: object
      properties:
        idempotency_key:
          type: string
          description: >
            Required. Replaying an identical accept with the same key
            against the same changeset returns the original result instead
            of re-applying it (architecture.md §15) — "identical" now
            includes which tasks were selected (#169): reusing a key with
            a different selection against the same changeset is rejected
            as a reused key, the same as any other differing request.
        tasks:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: >
                  Position in the changeset's currently-stored
                  proposed_tasks (as last returned by this changeset's
                  GetChangeset/ListChangesets/a prior accept response) —
                  not a stable id, since it's only ever resolved against
                  that same snapshot.
              title:
                type: string
              description:
                type: string
              acceptance_criteria:
                type: array
                items:
                  type: string
            required:
              - index
              - title
          description: >
            Optional, and only meaningful on POST
            /projects/{id}/changesets/{changesetId}/accept (#169) — ignored
            by the create_project accept route, which has no proposed
            tasks. Selects which of the changeset's currently-proposed
            tasks to commit on this call, by index, with each one's
            (possibly edited) content — lets the client remove or edit
            decompose_task's proposal during review without a separate
            edit endpoint. Omit entirely to accept every currently-proposed
            task unmodified (the original all-at-once behavior). Any
            proposed task whose index isn't listed stays "proposed" on the
            changeset for a later accept (or removal via PATCH
            .../changesets/{changesetId}/tasks) instead of being discarded
            — see AcceptChangesetResponse's changeset field. The resolved
            selection can't be empty when the changeset has tasks to
            select from, can't repeat an index, and every title must be
            non-blank.
      required:
        - idempotency_key

    AcceptChangesetResponse:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
          description: Only the tasks committed by *this* call — not the changeset's original full proposal.
        event:
          $ref: "#/components/schemas/Event"
        changeset:
          $ref: "#/components/schemas/Changeset"
          description: >
            The changeset as it now stands (#169): still "proposed" with
            whatever wasn't selected this call, or "applied" once nothing
            is left. Use its proposed_tasks and updated indices for a
            follow-up accept or removal call.
      required:
        - project
        - tasks
        - event
        - changeset

    Task:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        parent_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        order:
          type: integer
        acceptance_criteria:
          type: array
          items:
            type: string
      required:
        - id
        - project_id
        - title
        - status
        - order

    Event:
      type: object
      description: >
        Append-only audit record of an accepted project change
        (architecture.md §9). There's no GET route for these yet.
      properties:
        id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
        type:
          type: string
          description: Only "changeset_accepted" exists today.
        changeset_id:
          type: string
        actor_id:
          type: string
        base_version:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - user_id
        - type
        - changeset_id
        - actor_id
        - base_version
        - created_at

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required:
        - error
        - fields
