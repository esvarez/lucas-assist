openapi: 3.0.3
info:
  title: Nudge API
  description: >
    Project CRUD routes served by the API Lambda (cmd/api) and the local dev
    server (cmd/local). Reflects the current implementation in
    internal/api — user_id is caller-supplied today; deriving it from a
    verified JWT is separate, undecided auth work (see AGENTS.md).
  version: "0.1.0"
servers:
  - url: http://localhost:8080
    description: Local dev server (make local)

paths:
  /projects:
    post:
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid body or failed validation (e.g. missing user_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: A project with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List projects for a user
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: Projects owned by user_id (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          description: user_id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      summary: Get a project by id
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: user_id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update a project
      description: >
        Updates the mutable fields only — goal, deadline, constraints,
        status. Name is immutable via this route.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid body, or failed validation (missing user_id or version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            version doesn't match the project's current version (optimistic
            concurrency, architecture.md §8) — re-fetch and retry, don't
            retry the same request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "204":
          description: Project deleted
        "400":
          description: user_id is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}/changesets/{changesetId}/accept:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
      - name: changesetId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Accept a proposed changeset
      description: >
        Atomically commits a proposed changeset's mutations (architecture.md
        §1/§8/§9): creates its proposed subtasks as real Task rows,
        increments the project's version, and writes one audit Event, all in
        a single transaction. Only valid from a changeset in the "proposed"
        state.
      operationId: acceptChangeset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptChangesetRequest"
      responses:
        "200":
          description: >
            The changeset was committed, or this exact request was already
            committed once before (idempotency_key replay) — both return the
            same body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptChangesetResult"
        "400":
          description: >
            Invalid body, failed validation (missing user_id or
            idempotency_key), or the changeset exceeds the maximum mutation
            count (architecture.md §8, ADR 009).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: No such project or changeset in this user's partition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The changeset's baseVersion no longer matches the project's
            current version (moves the changeset to "conflict" — re-propose
            rather than retry), the changeset isn't in the "proposed" state,
            or idempotency_key was already used for a different (project,
            changeset) pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    UserIdQuery:
      name: user_id
      in: query
      required: true
      description: Owner of the project(s). Caller-supplied for now.
      schema:
        type: string
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: No project with this id in this user's partition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Project:
      type: object
      properties:
        user_id:
          type: string
        id:
          type: string
        name:
          type: string
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
        version:
          type: integer
          description: >
            Optimistic-concurrency version (architecture.md §8). Starts at 1
            on create, increments by 1 on every successful update.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - user_id
        - id
        - name
        - goal
        - constraints
        - status
        - version
        - created_at
        - updated_at

    CreateProjectRequest:
      type: object
      properties:
        user_id:
          type: string
          description: Required — the DynamoDB key schema partitions by user.
        name:
          type: string
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
      required:
        - user_id

    UpdateProjectRequest:
      type: object
      description: name is intentionally absent — this route never touches it.
      properties:
        user_id:
          type: string
        version:
          type: integer
          description: >
            Required — the project's version as last read (Project.version).
            Rejected with 409 if it no longer matches the stored version
            (architecture.md §8).
        goal:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        constraints:
          type: array
          items:
            type: string
        status:
          type: string
      required:
        - user_id
        - version

    AcceptChangesetRequest:
      type: object
      description: >
        Deliberately minimal — everything the commit needs (baseVersion,
        proposed mutations, status) already lives on the changeset itself.
      properties:
        user_id:
          type: string
        idempotency_key:
          type: string
          description: >
            Required (architecture.md §15). Replaying the same key with the
            same (project, changeset) pair returns the original result
            instead of re-applying; reusing it for a different pair is
            rejected with 409.
      required:
        - user_id
        - idempotency_key

    AcceptChangesetResult:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        tasks:
          type: array
          items:
            type: object
            description: domain.Task — see internal/domain/task.go.
      required:
        - project
        - tasks

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required:
        - error
        - fields
